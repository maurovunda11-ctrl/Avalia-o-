<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Alunos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        h1, h2 {
            color: #333;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            max-width: 500px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .nav-buttons {
            margin-top: 20px;
        }
        .nav-buttons a {
            background-color: #333;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            margin-right: 10px;
            display: inline-block;
            border-radius: 4px;
        }
        .nav-buttons a:hover {
            background-color: #555;
        }
        .info {
            background: #e9ecef;
            padding: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #4CAF50;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    
    

    <form id="studentForm">
        <label>Nome do Aluno:</label>
        <input type="text" id="nome" required placeholder="Digite o nome completo">

        <label>Disciplina:</label>
        <input type="text" id="disciplina" required placeholder="Ex: Matemática, Português">

        <label>Nota 1º Trimestre)</tabel>
        <input type="number" id="nota1" step="0.1" min="0" max="20" required>

        <label>Nota 2º Trimestre </label>
        <input type="number" id="nota2" step="0.1" min="0" max="20" required>

        <label>Nota 3º Trimestre </label>
        <input type="number" id="nota3" step="0.1" min="0" max="20" required>

        <input type="submit" value="➕ Adicionar Aluno">
    </form>

    <div class="nav-buttons">
        <a href="ttt2.html"> Ver Tabela</a>
        <a href="ttt3.html"> Ver Resultados</a>
    </div>

    <script>
        function getAlunos() {
            const saved = localStorage.getItem('alunos');
            return saved ? JSON.parse(saved) : [];
        }

        function saveAlunos(alunos) {
            localStorage.setItem('alunos', JSON.stringify(alunos));
        }

        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const disciplina = document.getElementById('disciplina').value.trim();
            const nota1 = parseFloat(document.getElementById('nota1').value);
            const nota2 = parseFloat(document.getElementById('nota2').value);
            const nota3 = parseFloat(document.getElementById('nota3').value);

            if (!nome || !disciplina) {
                alert('Preencha nome e disciplina!');
                return;
            }

            if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
                alert('Preencha todas as notas!');
                return;
            }

            if (nota1 < 0 || nota1 > 20 || nota2 < 0 || nota2 > 20 || nota3 < 0 || nota3 > 20) {
                alert('As notas devem estar entre 0 e 20!');
                return;
            }

            const alunos = getAlunos();
            alunos.push({ nome, disciplina, nota1, nota2, nota3 });
            saveAlunos(alunos);

            this.reset();
            alert('Aluno cadastrado com sucesso!');
        });
    </script>
</body>
</html>
